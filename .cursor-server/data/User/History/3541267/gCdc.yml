services:
  ai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    environment:
      - OLLAMA_URL=http://ollama:11434
    networks:
      - ai-network
      - ai-net
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

networks:
  ai-network:
    driver: bridge
  ai-net:
    external: true


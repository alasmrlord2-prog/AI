global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'ai-backend'
    static_configs:
      - targets: ['172.31.20.228:8000']
        labels:
          service: 'ai-backend'
          environment: 'production'
    scrape_interval: 10s
    metrics_path: '/metrics'
    scrape_timeout: 10s


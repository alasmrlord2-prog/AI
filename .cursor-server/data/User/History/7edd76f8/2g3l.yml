global:
  scrape_interval: 15s
  evaluation_interval: 15s
  rule_files:
    - '/etc/prometheus/alerts.yml'

scrape_configs:
  - job_name: 'ai-backend'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'ai-backend'
          environment: 'production'
    scrape_interval: 10s
    metrics_path: '/metrics'


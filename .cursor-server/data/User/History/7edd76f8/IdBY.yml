global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ai-backend'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'ai-backend'
          environment: 'production'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          service: 'node-exporter'
          environment: 'production'


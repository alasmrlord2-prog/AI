services:
  ai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
    networks:
      - ai-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

networks:
  ai-network:
    driver: bridge

